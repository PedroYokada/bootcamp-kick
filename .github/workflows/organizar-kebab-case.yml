name: Padronizar pastas em kebab-case

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/organizar-kebab-case.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Renomear estrutura organizacional para kebab-case
        shell: bash
        run: |
          set -euo pipefail

          mover() {
            origem="$1"
            destino="$2"
            if [ -e "$origem" ] && [ ! -e "$destino" ]; then
              mkdir -p "$(dirname "$destino")"
              git mv "$origem" "$destino"
              echo "Renomeado: $origem -> $destino"
            fi
          }

          # Pastas principais
          mover "01-fundamentos-web" "fundamentos-web"
          mover "02-javascript-front-end" "javascript-front-end"
          mover "03-projeto-xbox" "projeto-xbox"
          mover "04-wordpress" "wordpress"
          mover "05-python" "python"

          # Fundamentos / Front-end inicial
          mover "fundamentos-web/desafios-kick" "fundamentos-web/desafios-iniciais"
          mover "fundamentos-web/Desafio-05-Kick" "fundamentos-web/desafio-05-kick"
          mover "fundamentos-web/Desafio0708Kick" "fundamentos-web/desafio-07-08-kick"
          mover "fundamentos-web/desafiokick0910figma" "fundamentos-web/desafio-09-10-figma"
          mover "fundamentos-web/desafio11kick" "fundamentos-web/desafio-11-kick"
          mover "fundamentos-web/desafiokick13" "fundamentos-web/desafio-13-kick"
          mover "fundamentos-web/desafio017kick" "fundamentos-web/desafio-17-kick"

          # JavaScript / Front-end
          mover "javascript-front-end/desafio19kick" "javascript-front-end/desafio-19-kick"
          mover "javascript-front-end/desafiokick22" "javascript-front-end/desafio-22-kick"
          mover "javascript-front-end/desafiokick23" "javascript-front-end/desafio-23-kick"
          mover "javascript-front-end/desafio25kick" "javascript-front-end/desafio-25-kick"
          mover "javascript-front-end/desafio27kick" "javascript-front-end/desafio-27-kick"
          mover "javascript-front-end/desafio29kick" "javascript-front-end/desafio-29-kick"
          mover "javascript-front-end/desafio31kick" "javascript-front-end/desafio-31-kick"
          mover "javascript-front-end/parada34kick" "javascript-front-end/parada-34-kick"

          # Projeto Xbox
          mover "projeto-xbox/projetowebxboxkick" "projeto-xbox/projeto-xbox-figma"
          mover "projeto-xbox/desafiowebkick" "projeto-xbox/projeto-xbox-web"

          # Módulos finais
          mover "wordpress/ModuloIV-WordPress-Kick" "wordpress/modulo-iv-wordpress"
          mover "python/ModuloV-Python-Kick" "python/modulo-v-python"

          # Documentação
          mover "docs/MAPA-DE-ORIGENS.md" "docs/mapa-de-origens.md"
          mover "docs/RELATORIO-DE-MIGRACAO.md" "docs/relatorio-de-migracao.md"

      - name: Atualizar referências da estrutura antiga
        shell: bash
        run: |
          set -euo pipefail
          files=(README.md docs/*.md)

          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            sed -i \
              -e 's#01-fundamentos-web#fundamentos-web#g' \
              -e 's#02-javascript-front-end#javascript-front-end#g' \
              -e 's#03-projeto-xbox#projeto-xbox#g' \
              -e 's#04-wordpress#wordpress#g' \
              -e 's#05-python#python#g' \
              -e 's#desafios-kick#desafios-iniciais#g' \
              -e 's#Desafio-05-Kick#desafio-05-kick#g' \
              -e 's#Desafio0708Kick#desafio-07-08-kick#g' \
              -e 's#desafiokick0910figma#desafio-09-10-figma#g' \
              -e 's#desafio11kick#desafio-11-kick#g' \
              -e 's#desafiokick13#desafio-13-kick#g' \
              -e 's#desafio017kick#desafio-17-kick#g' \
              -e 's#desafio19kick#desafio-19-kick#g' \
              -e 's#desafiokick22#desafio-22-kick#g' \
              -e 's#desafiokick23#desafio-23-kick#g' \
              -e 's#desafio25kick#desafio-25-kick#g' \
              -e 's#desafio27kick#desafio-27-kick#g' \
              -e 's#desafio29kick#desafio-29-kick#g' \
              -e 's#desafio31kick#desafio-31-kick#g' \
              -e 's#parada34kick#parada-34-kick#g' \
              -e 's#projetowebxboxkick#projeto-xbox-figma#g' \
              -e 's#desafiowebkick#projeto-xbox-web#g' \
              -e 's#ModuloIV-WordPress-Kick#modulo-iv-wordpress#g' \
              -e 's#ModuloV-Python-Kick#modulo-v-python#g' \
              -e 's#MAPA-DE-ORIGENS.md#mapa-de-origens.md#g' \
              -e 's#RELATORIO-DE-MIGRACAO.md#relatorio-de-migracao.md#g' \
              "$file"
          done

      - name: Validar pastas principais
        shell: bash
        run: |
          set -euo pipefail
          for dir in fundamentos-web javascript-front-end projeto-xbox wordpress python docs; do
            test -d "$dir" || { echo "Pasta ausente: $dir"; exit 1; }
          done

      - name: Registrar alterações
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "refactor: padroniza estrutura em kebab-case"
            git push origin main
          fi
